services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - TZ=UTC
    volumes:
      - ./volumes/etcd:/etcd
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --name=etcd-1
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd-1=http://0.0.0.0:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-10-16T04-13-43Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data
    restart: unless-stopped

  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: milvus-pulsar
    command: bin/pulsar standalone
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
    volumes:
      - ./volumes/pulsar:/pulsar/data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.0
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      PULSAR_ADDRESS: pulsar:6650
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"   # Milvus gRPC / HTTP 接口
      - "9091:9091"     # Metric
    depends_on:
      - etcd
      - minio
      - pulsar
    restart: unless-stopped
